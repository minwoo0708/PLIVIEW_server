# 로컬 MySQL 8.4 (DB: music_review). 비밀번호는 환경변수 DB_PASSWORD로 전달
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:music_review}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 docs/schema.sql 기준. 개발 중에는 update, 안정되면 validate로 변경
      ddl-auto: update
    show-sql: false
