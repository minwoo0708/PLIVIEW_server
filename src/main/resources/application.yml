spring:
  application:
    name: music-review-server
  profiles:
    # 기본은 local(H2 메모리 DB). MySQL을 쓰려면 SPRING_PROFILES_ACTIVE=mysql
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    # 기본(local, H2)은 Hibernate가 테이블을 만들고, mysql 프로필에서만 Flyway를 켬
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

app:
  jwt:
    # HS256 서명 키 (32바이트 이상). 운영/공유 환경에서는 반드시 환경변수로 넣을 것
    secret: ${JWT_SECRET}
    issuer: music-review-server
    expiration: 7d
  cors:
    # Flutter 웹 개발 서버는 포트가 매번 바뀌므로 localhost 전체 포트 허용. 배포 주소는 쉼표로 추가
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  spotify:
    # Spotify Developer Dashboard에서 발급. 없으면 /api/spotify/** 는 503 SPOTIFY_NOT_CONFIGURED
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    api-base-url: https://api.spotify.com/v1
    token-url: https://accounts.spotify.com/api/token
    market: KR
    connect-timeout: 3s
    read-timeout: 5s
    # 같은 Spotify 요청 응답 재사용 (모든 사용자가 앱 토큰 하나를 같이 쓰므로 호출 수를 줄임)
    cache-ttl: 2m
    cache-max-entries: 2000
    # 사용자 한 명이 1분에 보낼 수 있는 /api/spotify/** 요청 수 (넘으면 429 TOO_MANY_REQUESTS)
    requests-per-minute-per-user: ${SPOTIFY_RATE_LIMIT_PER_MINUTE:60}
  page:
    default-size: 20
    max-size: 50
