spring:
  application:
    name: music-review-server
  profiles:
    # 기본은 local(H2 메모리 DB). MySQL을 쓰려면 SPRING_PROFILES_ACTIVE=mysql
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

app:
  jwt:
    # HS256 서명 키 (32바이트 이상). 운영/공유 환경에서는 반드시 환경변수로 넣을 것
    secret: ${JWT_SECRET}
    issuer: music-review-server
    expiration: 7d
  spotify:
    api-base-url: https://api.spotify.com/v1
    connect-timeout: 3s
    read-timeout: 5s
  page:
    default-size: 20
    max-size: 50
